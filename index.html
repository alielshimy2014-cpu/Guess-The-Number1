<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess The Number</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff0000, #0033cc);
      color: yellow;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      width: 90%;
      max-width: 700px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.6);
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: yellow;
      font-size: 2.3em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px red, 0 0 20px blue;
    }

    p {
      font-size: 1.2em;
    }

    button {
      background-color: #0044ff;
      color: yellow;
      border: 2px solid yellow;
      padding: 12px 28px;
      border-radius: 10px;
      margin: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0066ff;
      transform: scale(1.05);
      box-shadow: 0 0 10px yellow;
    }

    input {
      width: 120px;
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      border: 2px solid yellow;
      margin: 8px;
      font-size: 16px;
      background-color: rgba(255, 255, 255, 0.1);
      color: yellow;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2em;
      text-shadow: 0 0 8px #000;
    }

    #tries {
      font-size: 1.1em;
      margin-top: 10px;
    }

    #compMessage {
      font-size: 1.3em;
      margin: 20px 0;
    }

    #compActions button {
      background-color: #ff0000;
      border-color: yellow;
    }

    #compActions button:hover {
      background-color: #ff3333;
      box-shadow: 0 0 10px yellow;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Guess The Number Game</h1>
    <p>Choose a mode:</p>
    <button onclick="chooseMode('player')">You Guess</button>
    <button onclick="chooseMode('computer')">Computer Guesses</button>

    <div id="setup" style="display:none;">
      <p>Enter the range:</p>
      <input type="number" id="min" placeholder="Min" />
      <input type="number" id="max" placeholder="Max" />
      <button onclick="startGame()">Start</button>
    </div>

    <!-- Player guesses -->
    <div id="playerGame" style="display:none;">
      <p>Enter your guess:</p>
      <input type="number" id="guess" />
      <button onclick="checkGuess()">Guess</button>
      <button onclick="resetGame()">Reset</button>
      <p id="message"></p>
      <p id="tries"></p>
    </div>

    <!-- Computer guesses -->
    <div id="computerGame" style="display:none;">
      <p>Think of a number between your range...</p>
      <button onclick="computerGuess()">Computer Guess</button>
      <div id="compActions" style="display:none;">
        <p id="compMessage"></p>
        <button onclick="tooLow()">Too Low</button>
        <button onclick="tooHigh()">Too High</button>
        <button onclick="correct()">Correct</button>
      </div>
      <button onclick="resetGame()">Reset</button>
    </div>
  </div>

  <script>
    let mode;
    let secretNumber;
    let tries = 0;
    let min, max;
    let compMin, compMax, compGuess;

    function chooseMode(selectedMode) {
      mode = selectedMode;
      document.getElementById("setup").style.display = "block";
      document.getElementById("playerGame").style.display = "none";
      document.getElementById("computerGame").style.display = "none";
    }

    function startGame() {
      min = parseInt(document.getElementById("min").value);
      max = parseInt(document.getElementById("max").value);

      if (isNaN(min) || isNaN(max) || min >= max) {
        alert("Please enter a valid range!");
        return;
      }

      if (mode === "player") {
        startPlayerGame();
      } else {
        startComputerGame();
      }
    }

    // Player guesses
    function startPlayerGame() {
      secretNumber = Math.floor(Math.random() * (max - min + 1)) + min;
      tries = 0;
      document.getElementById("setup").style.display = "none";
      document.getElementById("playerGame").style.display = "block";
      document.getElementById("message").textContent = "";
      document.getElementById("tries").textContent = "Tries: 0";
    }

    function checkGuess() {
      let guess = parseInt(document.getElementById("guess").value);
      if (isNaN(guess)) {
        alert("Please enter a number!");
        return;
      }

      tries++;
      if (guess === secretNumber) {
        document.getElementById("message").textContent =
          "🎉 Correct! The number was " + secretNumber;
      } else if (guess < secretNumber) {
        document.getElementById("message").textContent = "📉 Too low!";
      } else {
        document.getElementById("message").textContent = "📈 Too high!";
      }
      document.getElementById("tries").textContent = "Tries: " + tries;
    }

    // Computer guesses
    function startComputerGame() {
      compMin = min;
      compMax = max;
      tries = 0;
      document.getElementById("setup").style.display = "none";
      document.getElementById("computerGame").style.display = "block";
      document.getElementById("compMessage").textContent = "";
      document.getElementById("compActions").style.display = "none";
    }

    function computerGuess() {
      if (compMin > compMax) {
        document.getElementById("compMessage").textContent =
          "🤔 Hmm... Something’s wrong!";
        return;
      }

      compGuess = Math.floor((compMin + compMax) / 2);
      tries++;
      document.getElementById("compMessage").textContent =
        "Is it " + compGuess + "?";
      document.getElementById("compActions").style.display = "block";
    }

    function tooLow() {
      compMin = compGuess + 1;
      computerGuess();
    }

    function tooHigh() {
      compMax = compGuess - 1;
      computerGuess();
    }

    function correct() {
      document.getElementById("compMessage").textContent =
        "🎉 I got it! The number was " +
        compGuess +
        " in " +
        tries +
        " tries!";
      document.getElementById("compActions").style.display = "none";
    }

    function resetGame() {
      document.getElementById("setup").style.display = "none";
      document.getElementById("playerGame").style.display = "none";
      document.getElementById("computerGame").style.display = "none";
      document.getElementById("min").value = "";
      document.getElementById("max").value = "";
    }
  </script>
</body>
</html>
